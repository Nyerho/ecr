name: Security checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-and-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
        continue-on-error: true

      - name: Scan tracked files for high-risk secret patterns
        shell: bash
        run: |
          set -euo pipefail
          matches="$(git grep -nI -E '(BEGIN (RSA|OPENSSH|EC|PGP) PRIVATE KEY|AKIA[0-9A-Z]{16}|-----BEGIN)' -- ':!pnpm-lock.yaml' ':!package-lock.json' ':!mobile/package-lock.json' ':!.github/workflows/security.yml' || true)"
          if [[ -n "$matches" ]]; then
            echo "Potential secret material found in tracked files:"
            echo "$matches"
            exit 1
          fi
          echo "No high-risk secret patterns found in tracked files."

      - name: TypeScript validation
        run: pnpm exec tsc --noEmit
